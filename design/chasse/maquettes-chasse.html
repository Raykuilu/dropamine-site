<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Maquettes chasse</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#0b0806;color:#e8d9b0;margin:0;padding:28px;font-family:var(--body,Georgia,serif)}
h1{font-family:var(--display);font-variant:small-caps;color:var(--gold);margin:0 0 4px;font-size:30px;letter-spacing:.05em}
.sub{color:#a08c6a;font-style:italic;margin:0 0 18px}
.q-RARE{--q:#0070dd}.q-EPIC{--q:#a335ee}.q-UNCOMMON{--q:#1eff00}.q-COMMON{--q:#fff}.q-null,.q-undefined{--q:#9a8a6a}
.ic{width:52px;height:52px;border-radius:6px;border:2px solid var(--q);box-shadow:0 0 10px color-mix(in srgb,var(--q) 45%,transparent),inset 0 0 0 1px #000;background:#000 center/cover}
.nm{color:var(--q);font-weight:700;font-size:17px;line-height:1.15}
.src{color:#b9a27a;font-size:14px;font-style:italic}
.st{font-family:var(--num);font-size:15px;color:#e8d9b0}
.ok{color:#8cc472;font-weight:700}
.also{color:#e6c47c;font-size:13px}
.btn-or{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;background:linear-gradient(180deg,#f0d79a,#c49a5c);color:#2a1a08;font-family:var(--display);font-variant:small-caps;letter-spacing:.08em;font-weight:700}
/* A : armurerie */
.A{position:relative;display:grid;grid-template-columns:1fr 360px 1fr;gap:10px;align-items:center;min-height:560px;border-radius:14px;overflow:hidden;border:1px solid #5a4630;background:#000 center/cover}
.A::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.15) 35%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.78))}
.A>*{position:relative}
.A .acol{display:grid;gap:14px;padding:22px}
.A .aslot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.A .acol.r .aslot{grid-template-columns:minmax(0,1fr) 52px;text-align:right}
.A .acol.r .aslot .ic{grid-column:2;grid-row:1}
.A .afig{height:540px;background:center bottom/contain no-repeat}
.A .bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
/* B : vitrine */
.B{display:grid;grid-template-columns:330px minmax(0,1fr);border-radius:14px;overflow:hidden;border:1px solid #5a4630;background:linear-gradient(180deg,#2a2a1c,#141209)}
.B .pf{position:relative;background:#000 center/cover;min-height:560px}
.B .pf::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.85))}
.B .pf .afig{position:absolute;inset:20px 0 60px;background:center bottom/contain no-repeat;z-index:1}
.B .pf .cap{position:absolute;left:18px;bottom:14px;z-index:2}
.B .list{padding:20px 22px;display:grid;gap:12px;align-content:start}
.B .row{display:grid;grid-template-columns:52px minmax(0,1fr) 130px;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid rgba(196,154,92,.25);background:rgba(0,0,0,.22)}
.B .luck{display:grid;gap:4px;justify-items:end}
.B .lb{width:120px;height:6px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden}.B .lb>i{display:block;height:100%;background:linear-gradient(90deg,#a07a3c,#e6c47c)}
/* C : tableau de chasse */
.C{border-radius:14px;border:1px solid #5a4630;background:linear-gradient(180deg,#2a2a1c,#141209);padding:20px 22px}
.C .hd{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.C .med{width:84px;height:84px;border-radius:50%;border:3px solid #c49a5c;box-shadow:0 0 14px rgba(196,154,92,.45);background:#000 center 20%/cover}
.C .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.C .card{position:relative;padding:16px 14px 14px;border-radius:12px;border:1px solid rgba(196,154,92,.3);background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--q) 16%,transparent),transparent 60%),rgba(0,0,0,.25);text-align:center}
.C .card .ic{width:64px;height:64px;margin:0 auto 10px}
.C .ring{--p:0;width:58px;height:58px;border-radius:50%;margin:10px auto 0;display:grid;place-items:center;background:conic-gradient(#e6c47c calc(var(--p)*1%),rgba(0,0,0,.5) 0);font-family:var(--num);font-size:13px;color:#2a1a08}
.C .ring b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#1b1a12;color:#e8d9b0}
.C .card.found{border-color:rgba(140,196,114,.6)}
.C .card.found::after{content:"✓ trouvé";position:absolute;top:8px;right:10px;color:#8cc472;font-size:12px;font-weight:700}
</style></head>
<body><div id="out">…</div>
<script>
const V = new URLSearchParams(location.search).get('v') || 'a';
const RACE_BG = { 1: 'human', 2: 'orc', 3: 'dwarf', 4: 'night_elf', 5: 'undead', 6: 'tauren', 7: 'gnome', 8: 'troll' };
(async () => {
  const [hs, loot, items] = await Promise.all(['data/hiscores.json', 'data/loot.json', 'data/items.json'].map(u => fetch(u).then(r => r.json())));
  const p = hs.players.find(x => x.name === 'Ray');
  const idx = new Map(); for (const d of loot.dungeons) for (const b of d.bosses) for (const e of b.i) { const [id, rate] = Array.isArray(e) ? e : [e, null]; (idx.get(id) || idx.set(id, []).get(id)).push({ d, b, rate }); }
  const others = id => { const keys = new Set((idx.get(id) || []).map(x => x.d.key)); return hs.players.filter(o => o !== p && (o.dropamine?.hunt || []).some(h => !h.drops && (idx.get(h.id) || []).some(y => keys.has(y.d.key)))).length; };
  const bg = `https://render.worldofwarcraft.com/profile-backgrounds/v2/armory_bg_race_${RACE_BG[p.raceId]}.jpg`;
  const H = p.dropamine.hunt.map(h => { const it = items[h.id] || {}; const src = (idx.get(h.id) || []).sort((a, b) => (b.rate || 0) - (a.rate || 0))[0];
    const rate = src?.rate, luck = rate && h.tries ? Math.round(100 * (1 - Math.pow(1 - rate / 100, h.tries))) : null;
    return { h, it, q: it.q, name: (it.n && it.n[1]) || h.name, icon: it.ic ? 'https://render.worldofwarcraft.com/' + it.ic : '', boss: src ? (src.b.n[1] || src.b.n[0]) : '', dun: src ? src.d.name : '', rate, luck, o: others(h.id) }; })
    .sort((a, b) => (b.h.drops > 0) - (a.h.drops > 0) || b.h.tries - a.h.tries);
  const srcTxt = x => /^(Trash|Ennemis)/i.test(x.boss) ? `Monstres · ${x.dun}` : `${x.boss} · ${x.dun}${x.rate ? ` · ${String(x.rate).replace('.', ',')} %` : ''}`;
  const stat = x => x.h.drops ? `<span class="ok">✓ trouvé</span>` : x.h.tries ? `<span class="st">${x.h.tries} essais</span>` : `<span class="st" style="opacity:.6">à tenter</span>`;
  let html = `<h1>Ma chasse</h1><p class="sub">${p.name} ${p.surname} · ${H.length} objets recherchés · maquette ${V.toUpperCase()}</p>`;
  if (V === 'a') {
    const slot = x => `<div class="aslot q-${x.q}"><span class="ic" style="background-image:url('${x.icon}')"></span><span><span class="nm">${x.name}</span><br><span class="src">${srcTxt(x)}</span><br>${stat(x)}${x.o ? ` <span class="also">· ${x.o} autres y chassent</span>` : ''}</span></div>`;
    const half = Math.ceil(H.length / 2);
    html += `<div class="A" style="background-image:url('${bg}')"><div class="acol">${H.slice(0, half).map(slot).join('')}</div><div class="afig" style="background-image:url('${p.render}')"></div><div class="acol r">${H.slice(half).map(slot).join('')}</div>
      <div class="bar"><span class="src">Survol : infobulle complète de l'objet</span><span class="btn-or">Organiser une sortie</span></div></div>`;
  } else if (V === 'b') {
    html += `<div class="B"><div class="pf" style="background-image:url('${bg}')"><div class="afig" style="background-image:url('${p.render}')"></div><div class="cap"><span class="nm" style="--q:#e6c47c;font-size:22px">${p.name} ${p.surname}</span><br><span class="src">Druide 36 · ${p.guild?.name || ''}</span></div></div>
      <div class="list">${H.map(x => `<div class="row q-${x.q}"><span class="ic" style="background-image:url('${x.icon}')"></span><span><span class="nm">${x.name}</span><br><span class="src">${srcTxt(x)}</span>${x.o ? `<br><span class="also">${x.o} autres y chassent</span>` : ''}</span>
        <span class="luck">${stat(x)}${x.luck != null ? `<span class="lb"><i style="width:${x.luck}%"></i></span><span class="src" style="font-size:12px">${x.luck} % l'auraient déjà</span>` : ''}</span></div>`).join('')}
      <div><span class="btn-or">Organiser une sortie</span></div></div></div>`;
  } else {
    html += `<div class="C"><div class="hd"><span class="med" style="background-image:url('${p.render}')"></span><div><span class="nm" style="--q:#e6c47c;font-size:24px">Tableau de chasse</span><br><span class="src">${H.filter(x => x.h.drops).length} trouvé sur ${H.length} · ${H.reduce((a, x) => a + (x.h.tries || 0), 0)} essais au total</span></div><span class="btn-or" style="margin:0 0 0 auto">Organiser une sortie</span></div>
      <div class="grid">${H.map(x => `<div class="card q-${x.q}${x.h.drops ? ' found' : ''}"><span class="ic" style="display:block;background-image:url('${x.icon}')"></span><span class="nm">${x.name}</span><br><span class="src">${srcTxt(x)}</span><br>${stat(x)}
        ${x.luck != null ? `<div class="ring" style="--p:${x.luck}"><b>${x.luck}%</b></div><span class="src" style="font-size:12px">des joueurs l'auraient déjà</span>` : ''}${x.o ? `<br><span class="also">${x.o} autres y chassent</span>` : ''}</div>`).join('')}</div></div>`;
  }
  document.getElementById('out').innerHTML = html;
})();
</script></body></html>
