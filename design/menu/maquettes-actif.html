<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Maquettes menu</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#0b0806;margin:0;padding:22px 26px;color:#e8d9b0;font-family:var(--body,Georgia,serif)}
h2{font-family:var(--display);font-variant:small-caps;letter-spacing:.06em;color:#e6c47c;font-size:22px;margin:22px 0 8px}
h2 small{color:#a08c6a;font-family:var(--body);font-variant:normal;font-style:italic;font-size:14px;letter-spacing:0;margin-left:8px}
.bar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;background:linear-gradient(180deg,#1d160e,#120d08);border:1px solid #3a2c1a}
.tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-family:var(--display);font-variant:small-caps;letter-spacing:.09em;font-size:15px;color:#b9a27a}
.tab svg{width:22px;height:22px;flex:none}
.tab svg *{fill:none;stroke:#c49a5c;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#f0d79a}.tab.on svg *{stroke:#f0d79a}
/* 1 : icône au-dessus, actif en plaque dorée */
.v1 .tab{flex-direction:column;gap:4px;padding:6px 14px}
.v1 .tab.on{background:#2a2014;border:1px solid #6b5330}
/* 2 : icône à gauche, actif souligné du ruban trois couleurs */
.v2 .tab{position:relative}
.v2 .tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-2px;height:4px;border-radius:2px;background:linear-gradient(90deg,#b85a46 0 33%,#6a88c0 33% 66%,#5f9a4a 66%)}
/* 3 : médaillons */
.v3 .tab{flex-direction:column;gap:5px;padding:4px 12px}
.v3 .coin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #6b5330;background:radial-gradient(circle at 35% 30%,#2e2416,#120d08 70%);box-shadow:inset 0 0 0 2px #0b0806}
.v3 .coin svg{width:21px;height:21px}
.v3 .tab.on .coin{border-color:#e6c47c;background:radial-gradient(circle at 35% 30%,#f0d79a,#c49a5c 55%,#7a5a2a);box-shadow:0 0 12px rgba(230,196,124,.45)}
.v3 .tab.on .coin svg *{stroke:#2a1a08;stroke-width:1.8}
/* barre mobile */
.mob{display:grid;grid-template-columns:repeat(5,1fr);max-width:380px;margin-top:10px;padding:6px 4px;border-radius:14px;background:#120d08;border:1px solid #3a2c1a}
.mob .tab{flex-direction:column;gap:3px;padding:4px 0;font-size:11px;letter-spacing:.04em;justify-content:center;text-align:center}
.mob .tab svg{width:22px;height:22px}
.v3 .mob .coin{width:34px;height:34px}.v3 .mob .coin svg{width:18px;height:18px}
.row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.va .tab.on{position:relative}.va .tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:1px;background:linear-gradient(90deg,transparent,#e6c47c,transparent)}
.vb .tab.on{background:radial-gradient(120% 140% at 50% 120%,rgba(230,196,124,.22),transparent 70%);border:1px solid rgba(230,196,124,.35)}
.vc .tab{position:relative}.vc .tab.on::after{content:"";position:absolute;left:50%;bottom:-7px;width:9px;height:12px;transform:translateX(-50%);background:url(Dropamine-Logo.png) center/contain no-repeat}
.ribbon-demo{height:6px;margin-top:-1px;border-radius:0 0 6px 6px;background:linear-gradient(#b85a46 0 33%,#6a88c0 33% 66%,#5f9a4a 66%)}
</style></head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.8c3.6 4.4 6.2 8 6.2 11.2a6.2 6.2 0 0 1-12.4 0c0-3.2 2.6-6.8 6.2-11.2z"/><path d="M6.6 13.2c1.8-.9 3.6.9 5.4 0s3.6-.9 5.4 0"/><path d="M6.4 16.2c1.9-.8 3.7.8 5.6 0s3.7-.8 5.6 0"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7.5 4h9v4.5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 5.5H5a2.5 2.5 0 0 0 2.6 3.6"/><path d="M16.5 5.5H19a2.5 2.5 0 0 1-2.6 3.6"/><path d="M12 13v3.5"/><path d="M8.5 20h7l-.8-3.5H9.3z"/></symbol>
  <symbol id="i-banner" viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M6 4h11l-2.2 3.5L17 11H6"/><path d="M9.5 6.5l1.2 1 1.8-2"/></symbol>
  <symbol id="i-swords" viewBox="0 0 24 24"><path d="M4 4l9.5 9.5"/><path d="M4 4h3.2L15 11.8"/><path d="M20 4l-9.5 9.5"/><path d="M20 4h-3.2L9 11.8"/><path d="M6.2 15.8l2 2M15.8 17.8l2-2"/><path d="M5 19l2.2-2.2M19 19l-2.2-2.2"/></symbol>
  <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M7 4h10.5a2 2 0 0 1 0 4H17v10a2 2 0 0 1-2 2H6.5a2 2 0 0 1 0-4H7z"/><path d="M7 16V6"/><path d="M10 9h4.5M10 12h4.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c1.4-3.6 4-5.4 7.2-5.4s5.8 1.8 7.2 5.4"/></symbol>
</svg>
<script>
const T = [['drop', 'Dropamine'], ['trophy', 'Hiscores'], ['banner', 'Guildes'], ['swords', 'Chasse en groupe', 1], ['scroll', 'Nouveautés']];
const M = [['drop', 'Accueil'], ['trophy', 'Hiscores'], ['swords', 'Chasse', 1], ['banner', 'Guildes'], ['user', 'Moi']];
const ic = (k, coin) => { const s = `<svg><use href="#i-${k}"/></svg>`; return coin ? `<span class="coin">${s}</span>` : s; };
const bar = (list, coin, cls) => `<div class="${cls}">${list.map(([k, l, on]) => `<span class="tab${on ? ' on' : ''}">${ic(k, coin)}<span>${l}</span></span>`).join('')}</div>`;
const V = [['va', 'A · trait doré', 'fin filet doré sous l’onglet actif'], ['vb', 'B · lueur dorée', 'halo bronze discret derrière l’onglet actif'], ['vc', 'C · petite goutte', 'la goutte Dropamine sous l’onglet actif']];
document.body.insertAdjacentHTML('beforeend', V.map(([v, t, d]) => `<section class="${v}"><h2>${t}<small>${d}</small></h2>
  ${bar(T, false, 'bar')}<div class="ribbon-demo"></div><div class="row">${bar(M, false, 'mob')}</div></section>`).join(''));
</script>
</body></html>
