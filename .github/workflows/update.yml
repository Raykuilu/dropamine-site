name: Update hiscores and deploy

# Once a day (and on demand): fetch registered characters from the Blizzard API,
# commit the daily history, then publish the site on GitHub Pages.
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC, outside the busy hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "data/registry.json", "data/uploads.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Tests
        run: node --test scripts/*.test.mjs server/*.test.mjs

      - name: Fetch characters and compute scores
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: node scripts/build.mjs

      - name: Commit daily history
        run: |
          git config user.name "dropamine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history site/data/items.json site/data/art.json
          git diff --cached --quiet || git commit -m "Hiscores: daily history $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
