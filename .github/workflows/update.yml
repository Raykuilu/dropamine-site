name: Update hiscores and deploy

# Once a day (and on demand): fetch registered characters from the Blizzard API,
# commit the daily history, then publish the site on GitHub Pages.
# 7 times a day (none early morning): a light check (3 small API calls per character, compared with the live site);
# the full rebuild only runs when the armory changed (it updates when a player logs out).
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC, outside the busy hour: full rebuild
    - cron: "41 1,7,9,13,17,21,23 * * *"   # light check, Switzerland (winter time): 8:41, 10:41, 14:41, 18:41, 22:41, 0:41, 2:41; nothing 3h-8h
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "data/registry.json", "data/uploads.json"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    if: github.event_name == 'schedule' && github.event.schedule != '17 5 * * *'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: check
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: node scripts/check.mjs

  build:
    needs: check
    if: always() && (needs.check.result == 'skipped' || needs.check.outputs.changed == 'true')
    runs-on: ubuntu-latest
    # une reconstruction à la fois (la vérification horaire, elle, ne fait jamais attendre une ligne collée)
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Tests
        run: node --test scripts/*.test.mjs server/*.test.mjs

      - name: Fetch characters and compute scores
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: node scripts/build.mjs

      - name: Commit daily history
        run: |
          git config user.name "dropamine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/items-cache.json site/data/items.json site/data/i18n site/data/art.json
          git diff --cached --quiet || git commit -m "Hiscores: daily history $(date -u +%F)"
          # le serveur peut écrire entre-temps (ligne collée, objets recherchés) : on se remet à jour et on réessaie
          for i in 1 2 3 4 5; do git push && break; sleep $((i * 3)); git pull --rebase --quiet; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # la vérification horaire « sautée » ne doit pas empêcher la publication
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
